[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carylle"
version = "0.1.0"
description = "LLM-assisted endpoint detection and response with deterministic guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=6.0", "cryptography>=43", "httpx>=0.27"]

[project.optional-dependencies]
server = [
    "anthropic>=2.5,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
]
agent = ["psutil>=6.0", "watchdog>=5.0"]
# Optional agent capabilities. The agent runs without them and logs what it lost.
agent-full = ["psutil>=6.0", "watchdog>=5.0", "yara-python>=4.5", "scapy>=2.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
carylle-server = "carylle.main:run"
carylle-admin = "carylle.cli:main"
carylle-agent = "carylle_agent.main:main"

[tool.setuptools.packages.find]
where = ["server", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server", "agent", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:uvicorn.*", "ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess use is deliberate and takes no shell input
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"purple/*" = ["S", "E501"]
# Tables of regexes and rule definitions read better on one line each.
"server/carylle/pipeline/reasoning/fallback_scorer.py" = ["E501"]
"server/carylle/pipeline/reasoning/sanitizer.py" = ["E501"]
