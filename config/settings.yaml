# Carylle configuration. Secrets live in the environment, never in this file.
# Paths are relative to the working directory the process starts in.

server:
  host: 127.0.0.1
  port: 8443
  db_path: var/carylle.db
  ledger_anchor_path: var/ledger.anchor
  mitre_path: data/mitre/enterprise-attack.json
  safelist_path: config/safelist.yaml
  playbooks_path: config/playbooks/response_playbooks.yaml
  # Plain HTTP is refused on non-loopback binds unless this is set (lab only).
  allow_plaintext: false
  max_batch_events: 500
  max_body_bytes: 5242880
  # Agent IDs whose tokens are no longer accepted.
  revoked_agents: []

pipeline:
  # Deterministic score an event cluster needs before a case is opened.
  triage_threshold: 0.35
  # How far back to pull related events for context.
  context_window_seconds: 300
  max_case_events: 40
  # Same fingerprint within this window skips the LLM and uses the deterministic verdict.
  llm_cooldown_seconds: 300
  burst_window_seconds: 60
  burst_file_events: 200
  worker_poll_seconds: 2

llm:
  enabled: true
  model: claude-opus-5-5
  effort: medium
  max_tokens: 8000
  timeout_seconds: 60
  max_retries: 1
  # Spend guard. Beyond this rate cases use the deterministic scorer.
  max_calls_per_minute: 20
  breaker_failures: 5
  breaker_cooldown_seconds: 120
  # Security telemetry can trip safety classifiers. This asks the API to retry a
  # declined request on its recommended fallback model instead of returning a refusal.
  server_side_fallbacks: true

response:
  # observe: record what would happen, change nothing.
  # approve: every endpoint action waits for an operator.
  # autonomous: actions that clear every guardrail run without an operator.
  mode: approve
  min_autonomous_confidence: 0.85
  min_autonomous_severity: high
  # Autonomous actions also need this much deterministic evidence, so a model
  # judgement alone can never cause an unattended action.
  min_deterministic_score: 0.6
  max_actions_per_host_per_hour: 10
  max_actions_per_hour: 50
  # More hosts than this in ten minutes looks like a false positive storm.
  max_hosts_per_10min: 3
  approval_ttl_seconds: 3600
  command_ttl_seconds: 120

agent:
  server_url: https://127.0.0.1:8443
  # Path to a CA bundle, true for system roots. Never false outside a lab.
  verify_tls: true
  allow_insecure_http: false
  safelist_path: config/safelist.yaml
  flush_interval_seconds: 2
  command_poll_seconds: 5
  heartbeat_seconds: 30
  max_batch_events: 200
  queue_size: 10000
  spool_dir: var/spool
  spool_max_bytes: 104857600
  state_dir: var/agent
  # Off by default: a fresh install can observe but cannot kill or move anything.
  actuators_enabled: false
  quarantine_dir: var/quarantine
  terminate_grace_seconds: 3
  sensors:
    process_monitor:
      enabled: true
      poll_seconds: 1.0
      max_hash_bytes: 67108864
    file_watcher:
      enabled: true
      paths: [/tmp, /var/tmp, /dev/shm, /etc/cron.d, /etc/systemd/system, /root/.ssh, /var/www]
      max_hash_bytes: 67108864
      debounce_seconds: 0.5
    network_sniffer:
      enabled: true
      # auto: raw DNS capture when scapy and CAP_NET_RAW are available, plus connection polling.
      mode: auto
      poll_seconds: 5.0
      interface: null
  yara:
    enabled: true
    rules_dir: config/yara
    timeout_seconds: 30
    max_scan_bytes: 67108864
